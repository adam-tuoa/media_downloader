[project]
name = "usefulmedia"
version = "0.7.0"
description = "Desktop batch downloader for YouTube / Vimeo / Bandcamp, built on yt-dlp"
requires-python = ">=3.13"
license = "MIT"
license-files = ["../LICENSE"]
authors = [{ name = "Adam Simmons" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "platformdirs>=4.2",
    "certifi>=2024.2",
]

[project.scripts]
usefulmedia = "app.launcher:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]
build = ["pyinstaller>=6.11"]

[project.urls]
Homepage = "https://github.com/tuoa-tools/usefulmedia"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**/*"]  # the built UI travels with the package (Windows build has no PyInstaller)


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
