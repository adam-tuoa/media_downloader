[project]
name = "media-downloader"
version = "0.4.1"
description = "Desktop batch downloader for YouTube / Vimeo / Bandcamp, built on yt-dlp"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "platformdirs>=4.2",
    "certifi>=2024.2",
]

[project.scripts]
media-downloader = "app.launcher:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]
build = ["pyinstaller>=6.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**/*"]  # the built UI travels with the package (Windows build has no PyInstaller)


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
