name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04 # older glibc = runs on more distros
            name: linux-x64
          - os: macos-15-intel # Adam's Mac is Intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the UI
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install the backend and PyInstaller
        run: pip install -e "backend[build]"

      - name: Fetch yt-dlp, ffmpeg and deno for this platform
        run: python scripts/fetch_binaries.py

      - name: Bundle with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/MediaDownloader.spec

      - name: Add yt-dlp, ffmpeg and deno to the bundle (verbatim)
        run: python scripts/bundle_binaries.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/MediaDownloader -DestinationPath MediaDownloader-windows-x64.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Media Downloader.app" MediaDownloader-macos-x64.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf MediaDownloader-linux-x64.tar.gz MediaDownloader

      - uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-${{ matrix.name }}
          path: MediaDownloader-*.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Media Downloader ${{ github.ref_name }}
          files: artifacts/MediaDownloader-*
          body_path: packaging/RELEASE_NOTES.md
          generate_release_notes: true
